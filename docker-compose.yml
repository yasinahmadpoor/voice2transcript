services:
  transcription-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transcription-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
      - transcription-data:/app/data
    restart: unless-stopped

volumes:
  transcription-data:
