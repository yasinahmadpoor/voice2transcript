<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <style>
    @font-face { font-family: Vazirmatn; src: url('https://export.invalid/Vazirmatn-Regular.ttf'); font-weight: 400; }
    @font-face { font-family: Vazirmatn; src: url('https://export.invalid/Vazirmatn-Bold.ttf'); font-weight: 700; }
    @page {
      size: A4; margin: 22mm 23mm;
      @top-left { content: 'VOICE TO TRANSCRIPT'; font: 8pt Vazirmatn; color: #514789; }
      @bottom-right { content: 'Page ' counter(page) ' of ' counter(pages); font: 9pt Vazirmatn; color: #626b7a; }
    }
    body { font: 11pt/1.45 Vazirmatn, sans-serif; color: #202631; }
    h1 { font-size: 23pt; line-height: 1.3; font-weight: 700; color: #000; margin: 0 0 8pt; overflow-wrap: anywhere; }
    .meta { font-size: 10pt; color: #626b7a; margin-bottom: 20pt; }
    p { margin: 0 0 8pt; white-space: pre-wrap; overflow-wrap: anywhere; orphans: 2; widows: 2; }
    p[dir=rtl], h1[dir=rtl] { text-align: right; }
    strong { color: #514789; }
  </style>
</head>
<body>
  <h1 dir="{{ direction }}">{{ title }}</h1>
  <div class="meta">Transcript · {{ date }}</div>
  {% for line in lines %}<p dir="{{ line.direction }}">{% if line.label %}<strong>{{ line.label }}</strong>{% endif %}{{ line.body }}{% if not line.label and not line.body %}<br>{% endif %}</p>{% endfor %}
</body>
</html>
